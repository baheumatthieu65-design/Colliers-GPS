      <stop offset="0%" stop-color="#5A6F4E" />
      <stop offset="100%" stop-color="#3E4A35" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.2" />
    </filter>
  </defs>
  <!-- Background Circle -->
